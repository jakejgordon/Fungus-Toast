name: Docs check

on:
  push:
    paths:
      - "**/*.md"
  pull_request:
    paths:
      - "**/*.md"

permissions:
  contents: read

jobs:
  check-markdown-links:
    name: Check markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check relative markdown links
        run: python3 scripts/check_markdown_links.py
